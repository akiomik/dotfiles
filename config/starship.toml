format = """
$directory\
$custom\
$line_break\
$character"""

[directory]
format = "$path"	
truncation_length = 1000
# truncate_to_repo = false

[custom.branchstatus]
command = "git branch-status --mode zsh"
when = "git rev-parse --is-inside-work-tree 2>/dev/null"
format = " on $output"
shell = ["sh"]
